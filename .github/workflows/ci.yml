name: CI

# Sources/** and scripts/** are in the trigger paths because the ratchet job
# counts Swift debt too — a gate that does not fire on a Swift-only change is
# an inert gate.
on:
  push:
    branches: [main]
    paths:
      - 'SecurityCore/**'
      - 'Sources/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SecurityCore/**'
      - 'Sources/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecurityCore
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsqlite3-dev pkg-config clang libclang-dev llvm-dev libpam0g-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SecurityCore/target
          key: linux-cargo-${{ hashFiles('SecurityCore/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Run tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p security-linux

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecurityCore
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libsqlite3-dev pkg-config clang libclang-dev llvm-dev libpam0g-dev

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SecurityCore/target
          key: clippy-cargo-${{ hashFiles('SecurityCore/Cargo.lock') }}
          restore-keys: clippy-cargo-

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SecurityCore
    steps:
      - uses: actions/checkout@v4

      # cargo-deny's `advisories` check is the RustSec/cargo-audit engine;
      # `bans` surfaces duplicate deps and `sources` pins crates to crates.io.
      # Accepted advisories with no in-semver fix are documented in deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny (advisories, bans, sources)
        run: cargo deny check advisories bans sources

  ratchet:
    name: Debt ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Counted metrics that may only go DOWN. Baselines in
      # scripts/ratchet-baseline.txt; a rise fails the build. Pure shell, so
      # it needs no Rust or Swift toolchain and runs in seconds.
      - name: Ratchet
        run: ./scripts/ratchet.sh --check-only

  gate-selftests:
    name: Gate self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The gates test the code; these test the GATES. Each one drives a gate
      # with a deliberately broken input (a toolchain that cannot run tests; a
      # source tree discovery cannot see) and asserts the gate fails closed
      # rather than reporting a green it did not earn. Both defects shipped
      # once (see docs/build-records/2026-09-23-* and 2026-09-25-ratchet-*);
      # this job is what stops them coming back. Pure shell over a throwaway
      # tree — no Rust/Swift toolchain, no cache, runs in seconds.
      - name: Run every gate self-test
        run: |
          shopt -s nullglob
          tests=(scripts/tests/*.sh)
          # A glob that matched nothing would let this job pass having tested
          # nothing — the exact failure the self-tests themselves guard against.
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::no gate self-tests found under scripts/tests/ — the job would pass vacuously"
            exit 1
          fi
          rc=0
          for t in "${tests[@]}"; do
            echo "── $t ──"
            bash "$t" || { echo "::error::$t FAILED"; rc=1; }
          done
          exit $rc
